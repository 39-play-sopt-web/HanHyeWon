<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="혜원의 블로그입니다. 포토덤프와 좋아하는것 구경하세요!"
    />
    <title>1주차 과제</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <a
        href="https://www.youtube.com/watch?v=LLZ9oCGj1TA"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="header__avatar"
          src="./images/avatar.webp"
          alt="프로필 사진"
        />
      </a>

      <h1 class="header__title">하녜원 블로그</h1>

      <a
        class="header__social"
        href="https://github.com/gksgPDnjs"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="header__social-icon"
          src="./images/github.svg"
          alt="GitHub 프로필"
        />
      </a>
    </header>

    <div class="layout">
      <nav class="side-nav">
        <ul>
          <li><a href="#photo">📷 포토 덤프</a></li>
          <li><a href="#like">좋아하는 것</a></li>
          <li><a href="#interest">내 관심사</a></li>
          <li><a href="#letter">To. 웹토리</a></li>
        </ul>
      </nav>

      <main class="content">
        <section id="photo">
          <h2>📷 포토 덤프</h2>
          <div class="photo-grid">
            <figure class="photo photo--a">
              <img src="./images/photo-1.webp" alt="" />
            </figure>
            <figure class="photo photo--b">
              <img src="./images/photo-2.webp" alt="" />
            </figure>
            <figure class="photo photo--c">
              <img src="./images/photo-3.webp" alt="" />
            </figure>
            <figure class="photo photo--d">
              <img src="./images/photo-4.webp" alt="" />
            </figure>
            <figure class="photo photo--e">
              <img src="./images/photo-5.webp" alt="" />
            </figure>
            <figure class="photo photo--f">
              <img src="./images/photo-6.webp" alt="" />
            </figure>
          </div>
        </section>
        <section id="like">
          <h2>좋아하는 것</h2>
          <div class="like-banner">
            <ul class="like-list">
              <li class="like-item"><img src="./images/ku1.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku2.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku3.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku4.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku5.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku6.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku7.webp" alt="" /></li>

              <li class="like-item"><img src="./images/ku1.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku2.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku3.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku4.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku5.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku6.webp" alt="" /></li>
              <li class="like-item"><img src="./images/ku7.webp" alt="" /></li>
            </ul>
          </div>
        </section>
        <section id="interest">
          <h2>내 관심사</h2>
          <!-- 카드 7개 -->
          <ul class="card-list">
            <li class="card">
              <img class="card__thumb" src="./images/int1.webp" alt="" />
              <h3 class="card__title">치이카와귀여워</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int2.webp" alt="" />
              <h3 class="card__title">일본가고싶다</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int3.webp" alt="" />
              <h3 class="card__title">맛집탐방</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int4.webp" alt="" />
              <h3 class="card__title">냥이</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int5.webp" alt="" />
              <h3 class="card__title">커피없이못살아요</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int6.webp" alt="" />
              <h3 class="card__title">여전히두바이가좋아</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int7.webp" alt="" />
              <h3 class="card__title">여행가자</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">
                  좋아요
                </button>
                <button class="card__btn card__btn--dislike" type="button">
                  싫어요
                </button>
              </div>
            </li>
          </ul>
        </section>
        <section id="letter">
          <h2>To. 웹토리</h2>
          <div class="letter">
            <p class="letter__line">잘 부탁합니다!</p>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p>자기소개 끝~~</p>
    </footer>
  </body>
</html>
