<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1주차 과제</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <a href="https://www.youtube.com/watch?v=LLZ9oCGj1TA" target="_blank">
      <img class="header__avatar" src="./images/avatar.png" alt="프로필 사진" />
      </a>

      <h2 class="header__title">하녜원 블로그</h2>

      <ul class="header__social">
        <li>
          <a href="https://github.com/gksgPDnjs" target="_blank" rel="noopener noreferrer">GitHub</a>
        </li>
      </ul>
    </header>

    <div class="layout">
      <nav class="side-nav">
        <ul>
          <li><a href="#photo">📷 포토 덤프</a></li>
          <li><a href="#like">좋아하는 것</a></li>
          <li><a href="#interest">내 관심사</a></li>
          <li><a href="#letter">To. 웹토리</a></li>
        </ul>
      </nav>

      <main class="content">
        <section id="photo">
          <h2>📷 포토 덤프</h2>
          <div class="photo-grid">
            <figure class="photo photo--a"><img src="./images/photo-1.jpg" alt="사진 1" /></figure>
            <figure class="photo photo--b"><img src="./images/photo-2.jpg" alt="사진 2" /></figure>
            <figure class="photo photo--c"><img src="./images/photo-3.jpg" alt="사진 3" /></figure>
            <figure class="photo photo--d"><img src="./images/photo-4.jpg" alt="사진 4" /></figure>
            <figure class="photo photo--e"><img src="./images/photo-5.jpg" alt="사진 5" /></figure>
            <figure class="photo photo--f"><img src="./images/photo-6.jpg" alt="사진 6" /></figure>
          </div>
        </section>
        <section id="like">
          <h2>좋아하는 것</h2>

          <ul class="like-list">
            <li class="like-item"><img src="./images/ku1.jpg" alt="좋아하는 것 1" /></li>
            <li class="like-item"><img src="./images/ku2.jpg" alt="좋아하는 것 2" /></li>
            <li class="like-item"><img src="./images/ku3.jpg" alt="좋아하는 것 3" /></li>
            <li class="like-item"><img src="./images/ku4.jpg" alt="좋아하는 것 4" /></li>
            <li class="like-item"><img src="./images/ku5.jpg" alt="좋아하는 것 5" /></li>
            <li class="like-item"><img src="./images/ku6.jpg" alt="좋아하는 것 6" /></li>
            <li class="like-item"><img src="./images/ku7.jpg" alt="좋아하는 것 7" /></li>
          </ul>
        </section>
        <section id="interest">
          <h2>내 관심사</h2>
          <!-- 카드 7개 -->
          <ul class="card-list">
            <li class="card">
              <img class="card__thumb" src="./images/int1.jpg" alt="치이카와귀여워" />
              <h3 class="card__title">치이카와귀여워</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int2.jpg" alt="일본가고싶다" />
              <h3 class="card__title">일본가고싶다</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int3.jpg" alt="맛집탐방" />
              <h3 class="card__title">맛집탐방</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int4.jpg" alt="냥이" />
              <h3 class="card__title">냥이</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int5.jpg" alt="커피없이못살아요" />
              <h3 class="card__title">커피없이못살아요</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int6.jpg" alt="여전히두바이가좋아" />
              <h3 class="card__title">여전히두바이가좋아</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
            <li class="card">
              <img class="card__thumb" src="./images/int7.jpg" alt="여행가자" />
              <h3 class="card__title">여행가자</h3>
              <div class="card__buttons">
                <button class="card__btn card__btn--like" type="button">좋아요</button>
                <button class="card__btn card__btn--dislike" type="button">싫어요</button>
              </div>
            </li>
          </ul>
        </section>
        <section id="letter">
          <h2>To. 웹토리</h2>
          <div class="letter">
            <p class="letter__line">잘 부탁합니다!</p>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p>자기소개 끝~~</p>
    </footer>
  </body>
</html>
